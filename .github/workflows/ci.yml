name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # Host tests use the system SQLite (see hooks in pubspec.yaml).
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --split-per-abi --debug

  # Supabase backend: Edge Function tests (Deno) and database tests (pgTAP,
  # concurrent matchmaking) on a local Postgres with all migrations applied.
  # Deno and the Supabase CLI come pinned from package.json.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DENO_FLAGS: --config supabase/functions/deno.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx deno fmt $DENO_FLAGS --check supabase
      - run: npx deno lint $DENO_FLAGS supabase
      - run: npx deno test $DENO_FLAGS --allow-read supabase/functions

      - run: npx supabase db start
      - run: npx supabase test db
      - run: npx deno test $DENO_FLAGS --allow-net --allow-env supabase/integration
